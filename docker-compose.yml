services:
  # Base de datos PostgreSQL con PostGIS
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: geoinformatica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inmobiliaria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: geo_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./geo-proyect-backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geoinformatica-network

  # Backend FastAPI
  backend:
    build:
      context: ./geo-proyect-backend
      dockerfile: Dockerfile
    container_name: geoinformatica-backend
    restart: unless-stopped
    environment:
      # Base de datos
      DATABASE_URL: postgresql://postgres:geo_pass@db:5432/inmobiliaria_db
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inmobiliaria_db
      DB_USER: postgres
      DB_PASSWORD: geo_pass
      
      # FastAPI
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost","http://frontend:3000"]'
      SECRET_KEY: "tu-secret-key-muy-segura-cambiar-en-produccion"
      
      # Modelo ML
      MODEL_PATH: /app/modelos/modelo_satisfaccion_venta.pkl
      
      # Environment
      ENVIRONMENT: production
    volumes:
      - ./geo-proyect-backend/app:/app/app:ro
      - ./geo-proyect-backend/modelos:/app/modelos:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - geoinformatica-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Nuxt 3
  frontend:
    build:
      context: ./geo-proyect-frontend/geo-proyect-frontend
      dockerfile: Dockerfile
    container_name: geoinformatica-frontend
    restart: unless-stopped
    environment:
      # Nuxt
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NODE_ENV: production
      
      # API Backend URLs
      NUXT_PUBLIC_API_BASE_URL: http://backend:8000/api/v1
      API_BASE_URL: http://localhost:3000
      # Para acceso desde navegador (frontend usa esto para fetch del lado del cliente)
      NUXT_PUBLIC_API_BROWSER_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - geoinformatica-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Redes
networks:
  geoinformatica-network:
    driver: bridge

# Volúmenes
volumes:
  postgres_data:
    driver: local
